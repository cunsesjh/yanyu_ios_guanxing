        <header class="app-header">

            <nav class="sim-nav">

            </nav>
        </header>

        <section class="archive-summary" aria-label="存档信息">
            <div class="archive-summary-info">
                <div class="archive-summary-item">
                    <span>存档状态</span>
                    <strong id="saveStatus">未导入</strong>
                </div>
                <div class="archive-summary-item">
                    <span>主角</span>
                    <strong id="archiveMainRole">—</strong>
                </div>
            </div>

        </section>
<section class="config-panel">
            <div class="config-row" id="roleSelectRow" hidden>
                <div class="config-group grow">
                    <label>角色</label>
                    <div class="select-with-btn">
                        <select id="roleSelect">
                            <option value="">请先导入存档</option>
                        </select>
                    </div>
                </div>
                <div class="config-group grow">
                    <label>筛选</label>
                    <input type="search" id="roleFilter" placeholder="名称 / ID / 标签" autocomplete="off">
                </div>
            </div>
        </section>

        <div id="roleStatusEmpty" class="role-status-empty">导入存档后选择角色，查看永久培养来源、当前进度与属性上限</div>

        <main id="roleStatusPanel" class="role-status-panel" hidden>
            <div id="roleStatus" class="role-status-groups"></div>
        </main>

        <footer class="app-footer">
            <p>数据来源于 <a href="https://wiki.biligame.com/yanyu/" target="_blank" rel="noopener">烟雨江湖 Wiki</a></p>
        </footer>

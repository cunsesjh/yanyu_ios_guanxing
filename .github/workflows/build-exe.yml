name: build-exe

# 推 v* 标签：自动构建 Windows exe → GitHub Release + Gitee Release + 代码同步 Gitee
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt

      - name: 下载 adb (platform-tools)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile $env:TEMP\pt.zip
          Expand-Archive $env:TEMP\pt.zip -DestinationPath $env:TEMP\pt -Force
          New-Item -ItemType Directory -Force adb | Out-Null
          Copy-Item $env:TEMP\pt\platform-tools\adb.exe adb\
          Copy-Item $env:TEMP\pt\platform-tools\AdbWinApi.dll adb\
          Copy-Item $env:TEMP\pt\platform-tools\AdbWinUsbApi.dll adb\

      - name: PyInstaller 打包
        run: python -m PyInstaller yyjh-guanxing.spec --noconfirm

      - name: 发布到 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ios观星.exe
          generate_release_notes: true

      # Gitee Release 同步：脚本方式，缺 token 或上传失败都会让本步骤报错（不再静默跳过）
      - name: 同步 exe 到 Gitee Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'cunses/yanyu_ios_guanxing' }}
        run: |
          if (-not $env:GITEE_TOKEN) {
            Write-Host '::error::未配置 secrets.GITEE_TOKEN —— Gitee 同步失败。请到仓库 Settings → Secrets → Actions 添加 GITEE_TOKEN（Gitee 私人令牌，勾选 projects 权限）'
            exit 1
          }
          python .github/scripts/gitee_release.py "dist/ios观星.exe" "${{ github.ref_name }}"

  sync-gitee-code:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送代码到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'cunses/yanyu_ios_guanxing' }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置 secrets.GITEE_TOKEN，无法同步代码到 Gitee"
            exit 1
          fi
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          for i in 1 2 3; do
            git push gitee "HEAD:main" --force && break || { echo "retry $i"; sleep 5; }
          done
          for i in 1 2 3; do
            git push gitee --tags --force && break || { echo "retry $i"; sleep 5; }
          done
          echo "Gitee 代码同步完成"

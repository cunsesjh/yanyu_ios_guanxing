name: build-exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt
      - name: 验证存档兼容和导入流程（不请求游戏服务器）
        run: |
          python -m unittest discover -s dev -p test_retrieve.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s dev -p test_capture_optional_memory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/check_har_decode.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/check_wizard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 下载 adb (platform-tools)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile "$env:TEMP/pt.zip"
          Expand-Archive "$env:TEMP/pt.zip" -DestinationPath "$env:TEMP/pt" -Force
          New-Item -ItemType Directory -Force adb | Out-Null
          Copy-Item "$env:TEMP/pt/platform-tools/adb.exe" adb/
          Copy-Item "$env:TEMP/pt/platform-tools/AdbWinApi.dll" adb/
          Copy-Item "$env:TEMP/pt/platform-tools/AdbWinUsbApi.dll" adb/
      - name: PyInstaller 打包
        run: python -m PyInstaller yyjh-guanxing.spec --noconfirm
      - name: 保存 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/ios观星.exe
          if-no-files-found: error
      - name: 发布到 GitHub Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name == 'v2.9' && 'v2.9(适配ios73576)' || github.ref_name }}
          files: dist/ios观星.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

  sync-gitee-code:
    runs-on: ubuntu-latest
    concurrency:
      group: gitee-code
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 同步 main 和当前版本 tag（保留历史，失败时明确报错）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'cunses/yanyu_ios_guanxing' }}
        run: python .github/scripts/gitee_sync.py

  sync-gitee-release:
    needs: [build, sync-gitee-code]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist
      - name: 同步 Gitee Release 附件
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'cunses/yanyu_ios_guanxing' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/gitee_release.py "dist/ios观星.exe" "$RELEASE_TAG"

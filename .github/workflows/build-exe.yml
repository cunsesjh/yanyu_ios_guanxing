name: build-exe

# 推 v* 标签自动构建 Windows exe 并挂到 Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 Release / 上传资产需要（Settings→Actions→Workflow permissions 也要允许 Read and write）

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt

      - name: 下载 adb (platform-tools)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile $env:TEMP\pt.zip
          Expand-Archive $env:TEMP\pt.zip -DestinationPath $env:TEMP\pt -Force
          New-Item -ItemType Directory -Force adb | Out-Null
          Copy-Item $env:TEMP\pt\platform-tools\adb.exe adb\
          Copy-Item $env:TEMP\pt\platform-tools\AdbWinApi.dll adb\
          Copy-Item $env:TEMP\pt\platform-tools\AdbWinUsbApi.dll adb\

      - name: PyInstaller 打包
        run: python -m PyInstaller yyjh-guanxing.spec --noconfirm

      # 关键：直接把 exe 作为 Release 资产上传，不要用 upload-artifact（那个只出 zip）
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ios观星.exe
          generate_release_notes: true

      # 同步一份到 Gitee 的同名 Release（镜像）
      - name: 同步 exe 到 Gitee Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if (-not $env:GITEE_TOKEN) { Write-Host '未配置 secrets.GITEE_TOKEN，跳过 Gitee 同步'; exit 0 }
          $tag = "${{ github.ref_name }}"
          $repo = "cunses/yanyu_ios_guanxing"
          $h = @{ Authorization = "token $env:GITEE_TOKEN" }
          $rels = Invoke-RestMethod -Headers $h -Uri "https://gitee.com/api/v5/repos/$repo/releases?per_page=20"
          $mine = $rels | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $mine) {
            $b = @{ tag_name = $tag; name = $tag; target_commitish = 'main'
                    body = "构建产物见附件 ios观星.exe（与 GitHub Release 同一份）"
                    prerelease = 'false'; draft = 'false' }
            $mine = Invoke-RestMethod -Method Post -Headers $h `
              -Uri "https://gitee.com/api/v5/repos/$repo/releases" -Body $b
          }
          $f = Get-Item 'dist/ios观星.exe'
          Invoke-RestMethod -Method Post -Headers $h `
            -Uri "https://gitee.com/api/v5/repos/$repo/releases/$($mine.id)/attach_files" `
            -Form @{ access_token = $env:GITEE_TOKEN; file = $f }
          Write-Host "Gitee Release $($mine.tag_name) 已同步 $($f.Name)"
# v2.6-版本号对齐

name: Build Windows desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      IOSGUANXING_DISABLE_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt "pyinstaller>=6.10,<7"
      - name: Offline tests including Windows credential encryption
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Improved wash engine and legacy route replay
        run: node tests/test_auto_wash2.cjs
      - name: Dynamic wash eligibility regression
        run: node tests/test_wash_dynamic_pool.cjs
      - name: Embedded page smoke test
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
          IOSGUANXING_SCREENSHOTS: build/screenshots
        run: python dev/smoke_desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: desktop-test-report
          path: |
            build/smoke.json
            build/screenshots/*.png
          if-no-files-found: ignore
      - name: All module layouts at minimum and default window sizes
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python dev/check_desktop_layout.py
      - name: Dropdown confirmation
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python dev/check_desktop_controls.py
      - name: History deletion and active page cleanup
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python dev/check_history_delete.py
      - name: Independent improved wash module
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python dev/check_auto_wash2.py
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: desktop-layout-report
          path: |
            build/layout/
            build/wash2/
          if-no-files-found: ignore
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean iosGuanxing.spec
      - name: Packaged executable startup and embedded page test
        shell: pwsh
        run: |
          $env:IOSGUANXING_SMOKE_REPORT = "$env:RUNNER_TEMP\packaged-smoke.json"
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu'
          $process = Start-Process dist/iosGuanxing.exe -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged startup timed out' }
          if (-not (Test-Path $env:IOSGUANXING_SMOKE_REPORT)) { throw 'Packaged smoke report missing' }
          $report = Get-Content $env:IOSGUANXING_SMOKE_REPORT -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged embedded page failed' }
          Get-Content $env:IOSGUANXING_SMOKE_REPORT
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/iosGuanxing.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  iosGuanxing.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: iosGuanxing-Windows-x64
          path: |
            dist/iosGuanxing.exe
            dist/SHA256SUMS.txt
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: iosGuanxing ${{ github.ref_name }}（${{ github.repository == 'cunsesjh/iosGuanxing' && '测试版' || '正式版' }}）
          prerelease: ${{ github.repository == 'cunsesjh/iosGuanxing' }}
          body: |
            ## v3.0.7-beta.5 测试版更新说明

            自动洗脉（改进）新增脉序状态提示：显示欧气种子是否固定、导入起点后的首条紫脉是否为保底及其置换锚点资格，并说明当前规划是否纳入无限置换起手。

            种子固定不等同于确认使用过无限置换；状态提示根据当前存档和脉序推演，不代表游戏操作历史。
          files: |
            dist/iosGuanxing.exe
            dist/SHA256SUMS.txt

  sync-gitee-code:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'cunsesjh/yanyu_ios_guanxing'
    runs-on: ubuntu-latest
    concurrency:
      group: gitee-code
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync main and release tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'cunses/yanyu_ios_guanxing' }}
        run: python .github/scripts/gitee_sync.py

